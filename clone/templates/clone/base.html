<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Brain 2{% endblock %}</title>
<style>
:root{--bg:#060a10;--card:#0f1622;--line:#243044;--c:#5eead4;--t:#eaf0f7;--m:#9aabbf}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 10% -10%,#152238,var(--bg));color:var(--t);font-family:system-ui,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:16px 14px 70px}a{color:var(--c);text-decoration:none}
nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;font-size:14px}
h1{font-size:1.45rem;margin:0 0 8px}.muted{color:var(--m);line-height:1.5;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
label{display:block;margin:10px 0 5px;color:var(--m);font-size:12px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0a111b;color:var(--t);font:inherit}
textarea{min-height:80px}
.btn{display:inline-block;background:linear-gradient(135deg,#5eead4,#14b8a6);color:#042f2e;border:0;padding:11px 16px;border-radius:10px;font-weight:700;margin-top:10px}
.btn2{background:transparent;color:var(--t);border:1px solid var(--line)}
.bubble{padding:10px 12px;border-radius:12px;margin:8px 0;line-height:1.45;font-size:14px}
.me{background:#1a2740}.bot{background:#0d2c28;border:1px solid #134e4a}
.row{display:flex;gap:8px;flex-wrap:wrap}
</style></head><body><div class="wrap">
<nav><a href="/">Home</a><a href="/create/">New Brain</a><a href="/lab/">All brains</a></nav>
{% block content %}{% endblock %}
</div></body></html>
