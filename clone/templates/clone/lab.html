{% extends "clone/base.html" %}
{% block content %}
<h1>All brains</h1>
{% for x in profiles %}
<div class="card"><a href="/p/{{ x.id }}/"><b>{{ x.name }}</b></a>
<div class="muted">{{ x.future_note|truncatechars:100 }}</div></div>
{% empty %}<p class="muted">Empty. <a href="/create/">Create</a></p>{% endfor %}
{% endblock %}
